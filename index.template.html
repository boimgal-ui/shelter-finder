<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<title>מקלט קרוב</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{ --bg:#0b3d2e; --bg2:#0f5840; --card:#ffffff; --accent:#16a34a; --accent2:#1d4ed8; --danger:#dc2626; --ink:#0f172a; --muted:#64748b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));
    color:#fff; min-height:100dvh;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    display:flex; flex-direction:column;
  }
  header{ text-align:center; padding:22px 0 10px; }
  header h1{ margin:0; font-size:26px; font-weight:800; letter-spacing:-.5px; }
  header p{ margin:6px 0 0; color:#bfe9d6; font-size:14px; }
  main{ flex:1; display:flex; flex-direction:column; gap:14px; max-width:520px; width:100%; margin:0 auto; }
  .find-btn{
    border:0; border-radius:20px; padding:22px; font-size:22px; font-weight:800; color:#fff;
    background:var(--accent); box-shadow:0 8px 24px rgba(22,163,74,.45); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px; transition:transform .08s;
  }
  .find-btn:active{ transform:scale(.98); }
  .find-btn[disabled]{ opacity:.6; }
  .status{ text-align:center; min-height:20px; color:#cdeede; font-size:14px; }
  .card{ background:var(--card); color:var(--ink); border-radius:20px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.25); display:none; }
  .card.show{ display:block; animation:pop .25s ease; }
  @keyframes pop{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .dist-row{ display:flex; align-items:center; gap:14px; }
  .arrow{ width:70px; height:70px; flex:0 0 auto; border-radius:50%; background:#ecfdf5; display:flex; align-items:center; justify-content:center; }
  .arrow svg{ transition:transform .3s ease; }
  .dist-main{ flex:1; }
  .dist-main .km{ font-size:30px; font-weight:800; line-height:1; }
  .dist-main .sub{ color:var(--muted); font-size:14px; margin-top:4px; }
  .tag{ display:inline-block; background:#eef2ff; color:#3730a3; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; margin-top:8px; }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .actions a{ text-decoration:none; text-align:center; padding:15px; border-radius:14px; font-weight:800; font-size:16px; color:#fff; }
  .nav-g{ background:var(--accent2); }
  .nav-w{ background:#14b8a6; }
  .coords{ margin-top:12px; font-size:12px; color:var(--muted); text-align:center; word-break:break-all; }
  .others{ margin-top:8px; }
  .others h3{ font-size:14px; color:var(--muted); margin:14px 0 8px; }
  .other{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#f8fafc; border-radius:12px; margin-bottom:8px; text-decoration:none; color:var(--ink); }
  .other .d{ font-weight:800; color:var(--accent2); }
  .err{ background:#fef2f2; color:var(--danger); border:1px solid #fecaca; }
  footer{ text-align:center; color:#9fd7c2; font-size:12px; padding:16px 0 4px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); padding:6px 12px; border-radius:999px; font-size:12px; color:#dff5ea; }
</style>
</head>
<body>
<header>
  <h1>🛡️ מקלט קרוב</h1>
  <p>שולחים מיקום — מקבלים את המקלט הקרוב ביותר</p>
</header>

<main>
  <button id="find" class="find-btn">📍 מצא מקלט קרוב אליי</button>
  <div id="status" class="status"><span class="pill" id="offline-pill">⚡ עובד גם בלי אינטרנט</span></div>

  <div id="result" class="card">
    <div class="dist-row">
      <div class="arrow"><svg id="arrowSvg" width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#16a34a"/></svg></div>
      <div class="dist-main">
        <div class="km" id="dist">—</div>
        <div class="sub" id="walk">—</div>
        <div class="tag" id="type">מקלט</div>
      </div>
    </div>
    <div class="actions">
      <a id="gmaps" class="nav-g" target="_blank" rel="noopener">🗺️ נווט בגוגל מפס</a>
      <a id="waze" class="nav-w" target="_blank" rel="noopener">🚗 נווט ב‑Waze</a>
    </div>
    <div class="coords" id="coords"></div>
    <div class="others" id="others"></div>
  </div>

  <div id="error" class="card err"></div>
</main>

<footer>נתוני מקלטים ציבוריים · ‎%COUNT% נקודות · המרחק בקו אווירי</footer>

<script>
// ===== נתוני המקלטים מוטמעים כאן — [lat, lon, type] =====
const SHELTERS = %DATA%;

const $ = id => document.getElementById(id);
const toRad = d => d * Math.PI / 180;

// מרחק בקו אווירי (Haversine) במטרים
function dist(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
// אזימוט (כיוון) מהמשתמש למקלט במעלות
function bearing(lat1, lon1, lat2, lon2){
  const y = Math.sin(toRad(lon2-lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}
function fmtDist(m){
  return m < 1000 ? Math.round(m) + " מ׳" : (m/1000).toFixed(m<10000?1:0) + " ק״מ";
}
function walkTime(m){
  const min = Math.round(m / 1000 / 5 * 60); // ~5 קמ"ש הליכה
  if (min < 1) return "פחות מדקת הליכה";
  if (min < 60) return "כ‑" + min + " דק׳ הליכה";
  return "כ‑" + (min/60).toFixed(1) + " שעות הליכה";
}

let lastHeading = null;
function nearest(lat, lon, k=4){
  const arr = SHELTERS.map((s,i) => ({i, lat:s[0], lon:s[1], type:s[2], d:dist(lat,lon,s[0],s[1])}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0, k);
}

function show(lat, lon){
  const top = nearest(lat, lon, 4);
  const n = top[0];
  $("dist").textContent = fmtDist(n.d);
  $("walk").textContent = walkTime(n.d);
  $("type").textContent = n.type && n.type.length ? n.type : "מקלט ציבורי";
  $("coords").textContent = `מקלט: ${n.lat}, ${n.lon}`;
  const brg = bearing(lat, lon, n.lat, n.lon);
  rotateArrow(brg);
  $("gmaps").href = `https://www.google.com/maps/dir/?api=1&destination=${n.lat},${n.lon}&travelmode=walking`;
  $("waze").href = `https://waze.com/ul?ll=${n.lat},${n.lon}&navigate=yes`;

  // מקלטים נוספים בקרבת מקום
  let html = "<h3>מקלטים נוספים בקרבת מקום</h3>";
  top.slice(1).forEach(o=>{
    const g = `https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lon}&travelmode=walking`;
    html += `<a class="other" href="${g}" target="_blank" rel="noopener"><span>${o.type && o.type.length ? o.type : "מקלט"}</span><span class="d">${fmtDist(o.d)}</span></a>`;
  });
  $("others").innerHTML = html;

  $("error").classList.remove("show");
  $("result").classList.add("show");
  $("status").innerHTML = '<span class="pill">✓ נמצא המקלט הקרוב ביותר</span>';
}

// סיבוב החץ לפי כיוון המקלט פחות כיוון המכשיר (אם יש מצפן)
let targetBearing = 0;
function rotateArrow(brg){
  targetBearing = brg;
  applyArrow();
}
function applyArrow(){
  const rot = lastHeading == null ? targetBearing : (targetBearing - lastHeading);
  $("arrowSvg").style.transform = `rotate(${rot}deg)`;
}

function fail(msg){
  $("result").classList.remove("show");
  $("error").innerHTML = "⚠️ " + msg;
  $("error").classList.add("show");
  $("status").innerHTML = "";
}

$("find").addEventListener("click", ()=>{
  if(!navigator.geolocation){ fail("הדפדפן לא תומך באיתור מיקום."); return; }
  $("status").innerHTML = '<span class="pill">📡 מאתר את המיקום שלך…</span>';
  $("find").disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos=>{ $("find").disabled = false; show(pos.coords.latitude, pos.coords.longitude); },
    err=>{
      $("find").disabled = false;
      const m = err.code === 1 ? "אין הרשאת מיקום. אפשרי גישה למיקום בהגדרות הדפדפן ונסי שוב."
              : err.code === 2 ? "לא הצלחנו לאתר מיקום. ודאי ש‑GPS פעיל."
              : "האיתור ארך זמן רב מדי. נסי שוב.";
      fail(m);
    },
    { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
  );
});

// מצפן (אופציונלי) — מסובב את החץ ביחס לכיוון שאליו את מפנה את הטלפון
function startCompass(){
  window.addEventListener("deviceorientationabsolute", e=>{
    if(e.alpha!=null){ lastHeading = 360 - e.alpha; applyArrow(); }
  }, true);
  window.addEventListener("deviceorientation", e=>{
    const h = e.webkitCompassHeading ?? (e.alpha!=null ? 360 - e.alpha : null);
    if(h!=null){ lastHeading = h; applyArrow(); }
  }, true);
}
startCompass();

// רישום service worker לאופליין (רק כשמוגש מ‑https/localhost)
if("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
